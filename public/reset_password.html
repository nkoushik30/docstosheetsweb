<!DOCTYPE html>
<html>

<head>
  <title>Reset Your Password</title>
  <script src="js/firebase-config.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f9fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h2 {
      color: #333;
    }

    .box {
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    input[type="email"] {
      padding: 10px;
      width: 100%;
      max-width: 300px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    p.note {
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Reset Your Password</h2>
    <input type="email" id="reset-email" placeholder="Enter your email" />
    <br />
    <button onclick="sendResetLink()">Send Reset Link</button>
    <p class="note">We'll send you a link to reset your password.</p>
  </div>

  <script>
    // ✅ Initialize Firebase
    const app = firebase.initializeApp(window.docsToSheetsFirebaseConfig);
    const auth = firebase.auth();

    // ✅ Function to send password reset email
    function sendResetLink() {
      const email = document.getElementById("reset-email").value;

      if (!email) {
        alert("Please enter your email.");
        return;
      }

      auth.sendPasswordResetEmail(email)
        .then(() => {
          alert("Password reset email sent! Please check your inbox or spam folder.");
        })
        .catch((error) => {
          console.error("Error sending reset email:", error);
          alert("Unable to send the password reset email. Please try again.");
        });
    }
  </script>
</body>

</html>
