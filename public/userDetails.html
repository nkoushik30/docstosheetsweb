<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --orange: #FF6B2B;
            --orange-light: #FF8C5A;
            --orange-glow: rgba(255, 107, 43, 0.18);
            --red: #E8312A;
            --red-light: #FF5A52;
            --sky: #38BCEF;
            --sky-light: #7AD4F7;
            --sky-dark: #1A8FC4;
            --sunny: #FFB830;
            --white: #FFFFFF;
            --off-white: #FFF8F5;
            --text-dark: #1A1A2E;
            --text-mid: #4A4A6A;
            --card-bg: rgba(255, 255, 255, 0.97);
            --shadow-warm: 0 20px 60px rgba(255, 107, 43, 0.13), 0 4px 20px rgba(56, 188, 239, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: #0f1623;
            position: relative;
        }

        /* Animated mesh background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(255, 107, 43, 0.28) 0%, transparent 60%),
                radial-gradient(ellipse 60% 70% at 85% 80%, rgba(56, 188, 239, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 184, 48, 0.10) 0%, transparent 70%),
                linear-gradient(135deg, #0f1623 0%, #181e30 60%, #0a1020 100%);
            z-index: 0;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.55;
            animation: drift 8s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #FF6B2B, #FF8C5A00);
            top: -80px;
            left: -60px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, #38BCEF, #38BCEF00);
            bottom: -60px;
            right: -40px;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #FFB830, #FFB83000);
            bottom: 30%;
            left: 8%;
            animation-delay: -5s;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, 20px) scale(1.08);
            }
        }

        /* Logo top */
        .logo-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .logo-container img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--orange), var(--sky));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        /* Main card */
        .container {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 0 0 36px;
            max-width: 430px;
            width: 95%;
            text-align: center;
            box-shadow: var(--shadow-warm), 0 0 0 1.5px rgba(255, 107, 43, 0.10);
            overflow: visible;
        }

        /* Card top banner */
        .card-banner {
            width: 100%;
            height: 110px;
            border-radius: 28px 28px 0 0;
            background: linear-gradient(110deg, var(--red) 0%, var(--orange) 45%, var(--sunny) 80%, var(--sky) 100%);
            position: relative;
            overflow: hidden;
        }

        /* Decorative banner shapes */
        .card-banner::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.09);
            top: -60px;
            right: -30px;
        }

        .card-banner::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            bottom: -40px;
            left: 30px;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--orange);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 40px 24px;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255, 107, 43, 0.2);
            border-top: 3px solid var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* User info */
        .user-info {
            display: none;
        }

        .user-info.show {
            display: block;
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Avatar */
        .user-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: -50px auto 20px;
            background: linear-gradient(135deg, var(--orange) 0%, var(--red) 50%, var(--sky-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 900;
            color: white;
            box-shadow: 0 8px 28px rgba(255, 107, 43, 0.35), 0 2px 8px rgba(0, 0, 0, 0.12);
            border: 4px solid #fff;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .user-avatar:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 14px 36px rgba(255, 107, 43, 0.40), 0 2px 8px rgba(0, 0, 0, 0.14);
        }

        /* Status dot */
        .user-avatar::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #2ECC71;
            border: 3px solid #fff;
            border-radius: 50%;
            bottom: 4px;
            right: 4px;
        }

        .user-name {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .user-email {
            display: inline-block;
            font-size: 13.5px;
            color: var(--sky-dark);
            font-weight: 500;
            margin-bottom: 24px;
            padding: 8px 20px;
            background: rgba(56, 188, 239, 0.10);
            border: 1.5px solid rgba(56, 188, 239, 0.25);
            border-radius: 50px;
            letter-spacing: 0.2px;
            transition: background 0.3s;
        }

        .user-email:hover {
            background: rgba(56, 188, 239, 0.18);
        }

        /* Details card */
        .user-details {
            margin: 0 24px;
            padding: 4px 0;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 107, 43, 0.04), rgba(56, 188, 239, 0.06));
            border: 1.5px solid rgba(255, 107, 43, 0.10);
            overflow: hidden;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            border-bottom: 1px solid rgba(255, 107, 43, 0.08);
            transition: background 0.2s;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item:hover {
            background: rgba(255, 107, 43, 0.04);
        }

        .detail-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--orange);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .detail-label .icon {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--orange-light), var(--orange));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            background: rgba(56, 188, 239, 0.09);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(56, 188, 239, 0.18);
        }

        /* Verified badge */
        .verified-yes {
            color: #1a9a5c;
            background: rgba(46, 204, 113, 0.12);
            border-color: rgba(46, 204, 113, 0.28);
        }

        .verified-no {
            color: var(--red);
            background: rgba(232, 49, 42, 0.09);
            border-color: rgba(232, 49, 42, 0.20);
        }

        /* Divider */
        .divider {
            margin: 26px 24px 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 43, 0.25), rgba(56, 188, 239, 0.25), transparent);
        }

        /* Logout button */
        .logout-btn {
            margin-top: 6px;
            padding: 14px 44px;
            background: linear-gradient(110deg, var(--red) 0%, var(--orange) 55%, var(--sunny) 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
            box-shadow: 0 4px 18px rgba(255, 107, 43, 0.30), 0 1px 6px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        .logout-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, rgba(255, 255, 255, 0.18), transparent 60%);
            pointer-events: none;
        }

        .logout-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 10px 32px rgba(255, 107, 43, 0.38), 0 2px 10px rgba(0, 0, 0, 0.12);
            filter: brightness(1.07);
        }

        .logout-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Error & No-user states */
        .error-message {
            display: none;
            margin: 24px;
            padding: 20px;
            border-radius: 14px;
            background: rgba(232, 49, 42, 0.08);
            border: 1.5px solid rgba(232, 49, 42, 0.22);
            color: var(--red);
            font-size: 14px;
        }

        .error-message h3 {
            margin-bottom: 6px;
            font-family: 'Playfair Display', serif;
        }

        .no-user {
            display: none;
            margin: 24px;
            padding: 20px;
            border-radius: 14px;
            background: rgba(255, 184, 48, 0.09);
            border: 1.5px solid rgba(255, 184, 48, 0.30);
            color: #8a5d00;
            font-size: 14px;
        }

        .no-user h3 {
            margin-bottom: 6px;
            font-family: 'Playfair Display', serif;
        }

        /* Subtle pattern on card bottom area */
        .card-footer-pattern {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 120px;
            height: 120px;
            opacity: 0.04;
            background: radial-gradient(circle at 80% 80%, var(--orange) 0%, transparent 70%);
            border-radius: 0 0 28px 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="logo-container">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <div class="logo-text">DocsToSheets</div>
    </div>

    <div class="container">
        <div class="card-banner"></div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>Loading your profile…</span>
        </div>

        <!-- User Info -->
        <div id="userInfo" class="user-info">
            <div class="user-avatar" id="userAvatar"></div>
            <div class="user-name" id="userName"></div>
            <div class="user-email" id="userEmail"></div>

            <div class="user-details">
                <div class="detail-item">
                    <span class="detail-label">
                        <span class="icon">✔</span> Verified
                    </span>
                    <span class="detail-value" id="emailVerified"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        <span class="icon">📅</span> Joined
                    </span>
                    <span class="detail-value" id="createdAt"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        <span class="icon">🔑</span> Last Login
                    </span>
                    <span class="detail-value" id="lastSignIn"></span>
                </div>
            </div>

            <div class="divider"></div>

            <a href="index.html" style="text-decoration:none;">
                <button id="logoutButton" class="logout-btn">Sign Out</button>
            </a>
        </div>

        <!-- Error -->
        <div id="errorMessage" class="error-message">
            <h3>⚠ Error Loading Profile</h3>
            <p id="errorText"></p>
        </div>

        <!-- No user -->
        <div id="noUser" class="no-user">
            <h3>🔒 Not Signed In</h3>
            <p>Please log in to view your profile.</p>
        </div>

        <div class="card-footer-pattern"></div>
    </div>

    <script src="js/firebase-config.js"></script>
    <!-- Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-auth-compat.min.js"></script>

    <script>
        firebase.initializeApp(window.docsToSheetsFirebaseConfig);
        const auth = firebase.auth();

        const loading = document.getElementById('loading');
        const userInfo = document.getElementById('userInfo');
        const errorMessage = document.getElementById('errorMessage');
        const noUser = document.getElementById('noUser');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        const emailVerified = document.getElementById('emailVerified');
        const createdAt = document.getElementById('createdAt');
        const lastSignIn = document.getElementById('lastSignIn');

        function showError(message) {
            loading.style.display = 'none';
            userInfo.classList.remove('show');
            noUser.style.display = 'none';
            errorMessage.style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        function showNoUser() {
            loading.style.display = 'none';
            userInfo.classList.remove('show');
            errorMessage.style.display = 'none';
            noUser.style.display = 'block';
        }

        function displayUserInfo(user) {
            try {
                const displayName = user.displayName || user.email;
                const initials = displayName.split(' ').map(n => n.charAt(0)).join('').toUpperCase().slice(0, 2);

                userAvatar.textContent = initials;
                userName.textContent = user.displayName || 'No display name';
                userEmail.textContent = user.email;

                const isVerified = user.emailVerified;
                emailVerified.textContent = isVerified ? '✔ Yes' : '✖ No';
                emailVerified.className = 'detail-value ' + (isVerified ? 'verified-yes' : 'verified-no');

                const fmt = d => d ? new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Unknown';
                createdAt.textContent = fmt(user.metadata.creationTime);
                lastSignIn.textContent = fmt(user.metadata.lastSignInTime);

                loading.style.display = 'none';
                errorMessage.style.display = 'none';
                noUser.style.display = 'none';
                userInfo.classList.add('show');
            } catch (error) {
                console.error('Error displaying user info:', error);
                showError('Failed to display user information. Please try again.');
            }
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                displayUserInfo(user);
            } else {
                showNoUser();
            }
        }, (error) => {
            showError('Authentication error. Please try again.');
        });

        auth.onIdTokenChanged((user) => {
            if (!user && auth.currentUser) {
                showError('Session expired. Please log in again.');
            }
        });

        document.getElementById('logoutButton').addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            }).catch((error) => {
                alert('Unable to sign out. Please try again.');
            });
        });

        setTimeout(() => {
            if (loading.style.display !== 'none') {
                showError('Timeout: Unable to load user information. Please check your Firebase configuration.');
            }
        }, 10000);
    </script>
</body>

</html>
